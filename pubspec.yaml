name: sovereign_ledger
description: A personal finance tracking mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.2.2

  # Local Storage
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0

  # Immutable Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Charts
  fl_chart: ^1.2.0

  # Liveness Verification
  facial_liveness_verification: ^2.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  path_provider: ^2.1.2
  path: ^1.9.0

  # Export
  csv: ^8.0.0
  pdf: ^3.10.7
  printing: ^5.12.0

  # Notifications
  flutter_local_notifications: ^21.0.0

  # Permissions
  permission_handler: ^12.0.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.1.5
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
